name: PHP CI/CD + SonarQube

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PHP_VERSION: "8.4"
  COMPOSER_CACHE_DIR: ~/.composer/cache

jobs:
  test:
    name: PHP Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer:v2

      - name: Check PHP version
        run: php -v

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Verify Composer autoload
        run: |
          test -f vendor/autoload.php
          composer dump-autoload --no-interaction --optimize

      - name: Run PHP syntax check
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            -print0 |
          xargs -0 -n1 php -l

      - name: Verify required MVC source directories
        shell: bash
        run: |
          set -e

          for directory in Config Controllers Core Models Views Webroot; do
            if [ ! -d "$directory" ]; then
              echo "::error::Required MVC directory '$directory' was not found."
              exit 1
            fi
          done

      - name: Verify application entry point
        shell: bash
        run: |
          set -e

          if [ ! -f Webroot/index.php ]; then
            echo "::error::Webroot/index.php was not found."
            exit 1
          fi

  sonar:
    name: SonarQube Scan
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=TVHoang99_MVC
            -Dsonar.projectName=PHP MVC
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=vendor/**,.git/**,.github/**,docker/**

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy production
    needs:
      - test
      - sonar
    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}

          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            git fetch origin main
            git reset --hard origin/main

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            sudo systemctl reload php8.4-fpm || true
            sudo systemctl reload apache2 || true

